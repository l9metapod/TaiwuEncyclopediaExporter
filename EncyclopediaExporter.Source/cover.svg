<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- 背景：深色渐变（暗夜墨色，衬托橘色书册） -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b1d14"/>
      <stop offset="0.5" stop-color="#1c1209"/>
      <stop offset="1" stop-color="#0f0905"/>
    </linearGradient>
    <!-- 橘色渐变（书册封面填充，非线条/文字区域） -->
    <linearGradient id="orangeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="0.5" stop-color="#ff8c1a"/>
      <stop offset="1" stop-color="#e85d04"/>
    </linearGradient>
    <!-- 书页米色渐变 -->
    <linearGradient id="pageGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5ecd7"/>
      <stop offset="1" stop-color="#e8d9b8"/>
    </linearGradient>
    <!-- 导出图标圆形渐变 -->
    <linearGradient id="exportGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a7bd5"/>
      <stop offset="1" stop-color="#1e4d8c"/>
    </linearGradient>
    <!-- 书册投影 -->
    <filter id="bookShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- 导出图标投影 -->
    <filter id="iconShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="4"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>
  <!-- 背景装饰：淡墨晕染圆 -->
  <circle cx="256" cy="200" r="180" fill="#ff8c1a" opacity="0.06"/>
  <circle cx="256" cy="200" r="120" fill="#ffb347" opacity="0.04"/>

  <!-- ============ 百晓册（古书，微微打开） ============ -->
  <g filter="url(#bookShadow)" transform="translate(256 215) rotate(-6)">
    <!-- 书脊厚度（底部） -->
    <path d="M -150 110 L 150 110 L 140 128 L -140 128 Z" fill="#6b3410"/>
    <!-- 左书页 -->
    <path d="M -150 -100 L -8 -108 L -8 110 L -150 110 Z" fill="url(#pageGrad)" stroke="#c4a673" stroke-width="1.5"/>
    <!-- 右书页 -->
    <path d="M 8 -108 L 150 -100 L 150 110 L 8 110 Z" fill="url(#pageGrad)" stroke="#c4a673" stroke-width="1.5"/>
    <!-- 中缝阴影 -->
    <path d="M -8 -108 L 0 -106 L 0 110 L -8 110 Z" fill="#d4c19a"/>
    <path d="M 0 -106 L 8 -108 L 8 110 L 0 110 Z" fill="#d4c19a"/>
    <rect x="-8" y="-108" width="16" height="218" fill="#8a6a3a" opacity="0.3"/>

    <!-- 左书页装饰横线（古书排版感） -->
    <g stroke="#b89968" stroke-width="1" opacity="0.55">
      <line x1="-135" y1="-70" x2="-25" y2="-74"/>
      <line x1="-135" y1="-50" x2="-25" y2="-54"/>
      <line x1="-135" y1="-30" x2="-60" y2="-32"/>
      <line x1="-135" y1="20" x2="-25" y2="16"/>
      <line x1="-135" y1="40" x2="-25" y2="36"/>
      <line x1="-135" y1="60" x2="-25" y2="56"/>
      <line x1="-135" y1="80" x2="-80" y2="78"/>
    </g>
    <!-- 右书页装饰横线 -->
    <g stroke="#b89968" stroke-width="1" opacity="0.55">
      <line x1="25" y1="-74" x2="135" y2="-70"/>
      <line x1="25" y1="-54" x2="135" y2="-50"/>
      <line x1="25" y1="16" x2="135" y2="20"/>
      <line x1="25" y1="36" x2="135" y2="40"/>
      <line x1="25" y1="56" x2="135" y2="60"/>
    </g>

    <!-- 书册封面区域：右书页上方贴一个"封皮"（橘色渐变填充） -->
    <!-- 封皮矩形：非线条/文字部分填橘色渐变 -->
    <rect x="20" y="-100" width="125" height="70" rx="3" fill="url(#orangeGrad)" stroke="#a8430a" stroke-width="2"/>
    <!-- 封皮边框线（双色线条） -->
    <rect x="26" y="-94" width="113" height="58" rx="2" fill="none" stroke="#7a2e05" stroke-width="1.2" opacity="0.7"/>

    <!-- "百"字（双色：深褐主色 + 橘金描边），居中封皮 -->
    <text x="82" y="-42" font-family="'KaiTi','STKaiti','SimSun',serif" font-size="52"
          font-weight="bold" text-anchor="middle" dominant-baseline="middle"
          fill="#3a1a05" stroke="#ffd700" stroke-width="0.8" paint-order="stroke">百</text>

    <!-- 左书页角落小印（古书印章感，朱红方框） -->
    <rect x="-140" y="88" width="22" height="16" fill="none" stroke="#a83232" stroke-width="1.5" opacity="0.8"/>
    <text x="-129" y="100" font-family="'KaiTi','STKaiti',serif" font-size="10"
          text-anchor="middle" fill="#a83232" opacity="0.85">册</text>
  </g>

  <!-- ============ 导出图标（右下角叠层） ============ -->
  <g filter="url(#iconShadow)" transform="translate(385 380)">
    <!-- 圆形底（蓝色，与橘色书册形成对比） -->
    <circle cx="0" cy="0" r="58" fill="url(#exportGrad)" stroke="#ffffff" stroke-width="3"/>
    <!-- 导出符号：文档 + 向下箭头（从书册导出文档） -->
    <!-- 文档主体 -->
    <path d="M -20 -28 L 8 -28 L 22 -14 L 22 22 L -20 22 Z"
          fill="#ffffff" stroke="#1e4d8c" stroke-width="1.5"/>
    <!-- 文档折角 -->
    <path d="M 8 -28 L 8 -14 L 22 -14 Z" fill="#cdddf2" stroke="#1e4d8c" stroke-width="1.2"/>
    <!-- 文档内横线（表示内容） -->
    <line x1="-13" y1="-6" x2="15" y2="-6" stroke="#5b87c4" stroke-width="1.8"/>
    <line x1="-13" y1="2" x2="15" y2="2" stroke="#5b87c4" stroke-width="1.8"/>
    <line x1="-13" y1="10" x2="5" y2="10" stroke="#5b87c4" stroke-width="1.8"/>
    <!-- 向下箭头（导出动作），叠在文档下方 -->
    <g transform="translate(0 34)">
      <rect x="-4" y="-8" width="8" height="10" fill="#ffffff"/>
      <path d="M -12 -2 L 0 12 L 12 -2 Z" fill="#ffffff"/>
    </g>
  </g>

  <!-- 标题文字（底部） -->
  <text x="256" y="478" font-family="'Microsoft YaHei','SimHei',sans-serif" font-size="26"
        font-weight="bold" text-anchor="middle" fill="#ffd9a0" letter-spacing="4">百科导出工具</text>
</svg>
